worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include "E:/Program Files/nginx-1.31.9/conf/mime.types";
    default_type application/octet-stream;

    # HTTP server configuration
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8000$request_uri;
    }
    
    # HTTPS server configuration
    server {
        listen 8000 ssl;
        http2 on;
        server_name localhost;

        # POINT TO LOCAL SSL CERTIFICATE AND KEY
        ssl_certificate      E:/Project/BookStore/src/Gateway/ssl/bookstore.crt;
        ssl_certificate_key  E:/Project/BookStore/src/Gateway/ssl/bookstore.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # API proxy configuration
        location /api/auth/ {
            proxy_pass http://localhost:5280;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Swagger proxy configuration for Auth service
        location /auth-swagger/ {
            proxy_pass http://localhost:5280/swagger/;
            proxy_set_header Host $host;
        }

        location /api/product/ {
            proxy_pass http://localhost:5187/api/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Swagger proxy configuration for Product service
        location /product-swagger/ {
            proxy_pass http://localhost:5187/swagger/;
            proxy_set_header Host $host;
        }

        location /api/cart/ {
            proxy_pass http://localhost:5142;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend proxy configuration
        location / {
            proxy_pass http://localhost:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}